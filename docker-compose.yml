services:

    backend:
      build: .
      container_name: bms-backend
      restart: unless-stopped

      ports:
        - "8000:8000"

      env_file:
        - .env
        - .env.docker

      depends_on:
        redis:
          condition: service_healthy

      healthcheck:
        test:
          [
            "CMD",
            "node",
            "-e",
            "fetch('http://localhost:8000').then(r => process.exit(r.ok ? 0 : 1)).catch(()=> process.exit(1))"   
          ]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 10s



    redis:
      image: redis:latest
      container_name: bms_redis
      ports:
        - "6379:6379"
      restart: unless-stopped

      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
      